bundle:
  name: cv_mlops_demo

include:
  - resources/*.yml

sync:
  include:
    - src/**
  exclude:
    - .venv/**
    - scratch/**
    - tests/**
    - "**/__pycache__/**"

# No workspace host is set here on purpose: the CLI uses the profile you pass with -p/--profile
# (or DATABRICKS_CONFIG_PROFILE / the DEFAULT profile), so the same bundle deploys to any workspace.
variables:
  catalog:
    description: >-
      Existing Unity Catalog catalog you can create a schema in (required). Set with --var catalog=<name>,
      BUNDLE_VAR_catalog, or .databricks/bundle/<target>/variable-overrides.json
  schema:
    description: Schema created by this bundle for tables, volume, model and inference tables
    default: cv_mlops_demo
  gpu_type:
    description: Serverless GPU accelerator for each training task (see the AI Runtime docs for the types your workspace offers)
    default: GPU_1xA10
  backbone_a:
    description: First model trained in parallel
    default: mobilenet_v3_large
  backbone_b:
    description: Second model trained in parallel (resnet50 and vgg16 are also supported)
    default: efficientnet_b0
  max_per_class:
    description: Images per (split, class). 0 = full dataset; small values give a fast smoke run
    default: 0
  epochs:
    default: 5
  accuracy_tolerance:
    description: Accuracy gap within which the faster model wins
    default: 0.005
  endpoint_name:
    default: cv-image-classifier
  notification_email:
    description: Who gets failure emails
    default: ${workspace.current_user.userName}

targets:
  dev:
    default: true
    # Not `mode: development`: that would rename UC objects to dev_<user>_*; the demo shows clean names.
    # Isolation between targets comes from the per-target schema and endpoint name.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
      tags:
        env: dev
    variables:
      endpoint_name: cv-image-classifier-dev

  prod:
    mode: production
    workspace:
      # For a real prod rollout, deploy from CI with `run_as: {service_principal_name: ...}`.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: cv_mlops_prod
      endpoint_name: cv-image-classifier
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
